name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Upload site files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create server-side integration config
        shell: bash
        run: |
          mkdir -p config
          cat > config/hubspot.php <<'PHP'
          <?php
          return [
              'token' => '${{ secrets.HUBSPOT_PRIVATE_APP_TOKEN }}',
              'pipeline_id' => '2346115797',
              'stage_id' => '3823191778',
          ];
          PHP
          cat > config/twilio.php <<'PHP'
          <?php
          return [
              'account_sid' => '${{ secrets.TWILIO_ACCOUNT_SID }}',
              'auth_token' => '${{ secrets.TWILIO_AUTH_TOKEN }}',
              'from_number' => '${{ secrets.TWILIO_FROM_NUMBER }}',
          ];
          PHP

      - name: Deploy via FTP/SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          server-dir: ${{ secrets.HOSTINGER_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            submissions/**
            README.md
            DEPLOYMENT.md
