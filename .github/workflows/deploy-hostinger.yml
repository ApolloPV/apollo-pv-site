name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Upload site files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create server-side integration config
        shell: bash
        run: |
          mkdir -p config
          cat > config/hubspot.php <<'PHP'
          <?php
          return [
              'token' => '${{ secrets.HUBSPOT_PRIVATE_APP_TOKEN }}',
              'pipeline_id' => '2346115797',
              'stage_id' => '3823191778',
          ];
          PHP
          cat > config/twilio.php <<'PHP'
          <?php
          return [
              'account_sid' => '${{ secrets.TWILIO_ACCOUNT_SID }}',
              'auth_token' => '${{ secrets.TWILIO_AUTH_TOKEN }}',
              'from_number' => '${{ secrets.TWILIO_FROM_NUMBER }}',
          ];
          PHP

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via FTP
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          SERVER_DIR: ${{ secrets.HOSTINGER_SERVER_DIR }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<EOF
          set ftp:ssl-allow no
          set net:timeout 20
          set net:max-retries 3
          mirror -R --only-newer --verbose \
            --exclude-glob .git/** \
            --exclude-glob .github/** \
            --exclude-glob submissions/** \
            --exclude-glob README.md \
            --exclude-glob DEPLOYMENT.md \
            ./ "$SERVER_DIR"
          bye
          EOF
